spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/permits}
    username: ${DB_USER:permits}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
server:
  port: 8080
  error:
    include-message: never
app:
  jwt-secret: ${JWT_SECRET}
  admin-local-part: ${ADMIN_LOCAL_PART:admin}
  admin-password: ${ADMIN_PASSWORD}
  secure-cookie: ${SECURE_COOKIE:false}
  allowed-origin: ${ALLOWED_ORIGIN:http://localhost:5173}
