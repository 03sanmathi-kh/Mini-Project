spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:permitworks_db}}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
server:
  port: 8080
  error:
    include-message: never
app:
  jwt-secret: ${JWT_SECRET}
  admin-local-part: ${ADMIN_LOCAL_PART:admin}
  admin-password: ${ADMIN_PASSWORD}
  secure-cookie: ${SECURE_COOKIE:false}
  allowed-origin: ${ALLOWED_ORIGIN:http://localhost:5173}

  upload-dir: ${UPLOAD_DIR:./uploads}
